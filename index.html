<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>STRAY</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#0c0f15 0%,#141a24 55%,#1a0f12 100%);color:#e8ecf1;font-family:'Segoe UI',Roboto,Arial,sans-serif;}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:18px;}
  h1{margin:0 0 6px;font-size:min(12vw,60px);font-weight:900;letter-spacing:6px;transform:skewX(-6deg);
    background:linear-gradient(180deg,#fff 25%,#ff3b4d 130%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  a.card{display:block;width:min(92vw,420px);padding:20px 22px;background:#11161f;border:1px solid #263142;color:inherit;text-decoration:none;
    clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));}
  a.card:hover,a.card:focus{border-color:#ff3b4d;}
  .t{font-size:20px;font-weight:900;letter-spacing:4px;}
  .s{margin-top:6px;font-size:12px;letter-spacing:1px;color:#8a96a8;line-height:1.6;}
  .tag{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:2px;color:#3ee6d8;}
</style>
</head>
<body>
<main>
  <h1>STRAY</h1>
  <a class="card" href="stray-survival.html">
    <div class="t">STRAY SURVIVAL</div>
    <div class="s">Co-op survival for up to 4 players. Hold the camp against endless waves, with a boss every third wave that comes back stronger each time.</div>
    <div class="tag">CO-OP · ENDLESS BOSSES · MOBILE</div>
  </a>
  <a class="card" href="stray-tactical.html">
    <div class="t">STRAY TACTICAL</div>
    <div class="s">1v1 duel. First to 5 kills wins.</div>
    <div class="tag">1V1 DUEL</div>
  </a>
</main>
</body>
</html>
