};

/* ---------------- rivals ---------------- */
S.rivalDef = (id) => D.rivals.find((r) => r.id === id);
S.rivalTech = (rv, fy) => M.interp(rv.arc, fy) * rv.tech * (G ? S.diff().rival : 1);
S.rivalSW = (rv, fy) => { let s = 70 + Math.min(18, (fy - 2010) * 1.1); if (rv.ownOS) s += 9; if (rv.legacyOS && fy > 2011.3) s -= Math.min(32, (fy - 2011.3) * 8); return s; };
S.RIVAL_NAMES = {
  nimbus: { flagship: (n) => 'Nimbus One ' + n, premium: (n) => 'Nimbus One ' + n + ' Lite' },
  vantage: { budget: (n) => 'Vantage A' + n, mid: (n) => 'Vantage M' + (n + 1) * 10, premium: (n) => 'Vantage Note ' + n, flagship: (n) => 'Vantage Prime S' + n },
  kestrel: { budget: (n) => 'Kestrel ' + n + '10', mid: (n) => 'Kestrel Lumen ' + n, premium: (n) => 'Kestrel N' + (n + 8) },
  orion: { mid: (n) => 'Orion Key ' + n, premium: (n) => 'Orion Bold ' + (n + 9) },
  xinghe: { budget: (n) => 'Xinghe Redstar ' + n, mid: (n) => 'Xinghe Note ' + n, flagship: (n) => 'Xinghe Mi ' + n },
  lumora: { budget: (n) => 'Lumora Y' + (n + 5), mid: (n) => 'Lumora Nova ' + n, premium: (n) => 'Lumora Mate ' + n, flagship: (n) => 'Lumora P' + n },
  bolt: { budget: (n) => 'Bolt Spark ' + n, mid: (n) => 'Bolt Volt ' + n },
};
S.rivalLaunch = (r, fy, initial) => {
  const rv = S.rivalDef(r.id);
  const techF = S.rivalTech(rv, fy);
  const created = [];
  rv.tiers.forEach((tier) => {
    const prof = { tech: techF, focus: rv.focus };
    const d = M.genPhone(fy, tier, prof);
    const lag = [2.4, 1.5, 0.7, 0][M.TI[tier]] + (1 - techF) * 6;
    const ay = fy - lag;
    const has = (id) => (D.tech[id] ? D.tech[id].year <= ay : true);
    const sw = S.rivalSW(rv, fy);
    const st = M.phoneStats(d, fy, { fy, has, sw });
    const price = Math.max(59, Math.round(st.bom * [1.8, 1.9, 2.1, 2.4][M.TI[tier]] * rv.priceMul / 10) * 10 - 1);
    const name = S.RIVAL_NAMES[r.id][tier](r.gen);
    const ph = { id: U.uid('rp'), rival: r.id, name, tier, design: d, price, launchPrice: price, launchFy: fy, ay, sw, st, color: rv.color, cut: 0 };
    r.phones.push(ph); created.push(ph);
  });
  r.gen++;
  // keep last 2 generations per tier
  r.phones = r.phones.filter((p) => fy - p.launchFy < 2.05);
  if (!initial && created.length) {
    const top = created[created.length - 1];
    S.news('📱 ' + rv.name + ' launches <b>' + top.name + '</b> at ' + U.money(top.price) + (created.length > 1 ? ' (+' + (created.length - 1) + ' more models)' : '') + '.', 'rival');
  }
};
S.rivalPhoneQ = (ph) => {
  if (ph._qt !== G.t) { ph._q = M.quality(ph.st, S.fy()); ph._qt = G.t; }
  return ph._q;
};

/* ---------------- market simulation ---------------- */
S.TYPES = [
  { id: 'general', share: 0.8, w: M.W },
  { id: 'gamer', share: 0.08, w: { perf: 0.38, camera: 0.05, display: 0.2, battery: 0.15, build: 0.05, software: 0.1, features: 0.04, connect: 0.03 } },
  { id: 'photo', share: 0.07, w: { perf: 0.12, camera: 0.45, display: 0.15, battery: 0.1, build: 0.08, software: 0.06, features: 0.02, connect: 0.02 } },
  { id: 'rugged', share: 0.05, w: { perf: 0.15, camera: 0.1, display: 0.1, battery: 0.3, build: 0.2, software: 0.07, features: 0.05, connect: 0.03 } },
];
S.regionShare = (r, fy) => { const t = U.clamp((fy - 2010) / 14, 0, 1); const tot = U.sum(D.regionIds, (k) => U.lerp(D.regions[k].s0, D.regions[k].s1, t)); return U.lerp(D.regions[r].s0, D.regions[r].s1, t) / tot; };
S.ecoFactor = () => { if (!S.has('os_own')) return 0; return U.clamp(Math.sqrt(G.ownBase / 4e7) * (S.has('appstore') ? 1 : 0.45) * (S.has('devprog') ? 1.5 : 1), 0, 1); };
S.marketProducts = () => {
  const prods = [];
  const fy = S.fy();
  G.rivals.filter((r) => r.alive).forEach((r) => {
    const rv = S.rivalDef(r.id);
    r.phones.forEach((ph) => {
      const q = S.rivalPhoneQ(ph);
      const age = (fy - ph.launchFy) * 12;
      let os = rv.ownOS ? 0.35 : 0;
      if (rv.legacyOS && fy > 2011.5) os -= Math.min(1.6, (fy - 2011.5) * 0.45);
      prods.push({ who: r.id, ph, price: ph.price, s: q.s, q: q.q, rep: r.rep / 100, hype: Math.max(0, 25 - age * 3), age, os, aware: (reg) => r.presence[reg] || 0, dist: (reg) => (r.presence[reg] > 0.02 ? 1 : 0), form: ph.design.form });
    });
  });
  G.phones.filter((p) => p.status === 'onsale' || (p.status === 'announced' && p.preorderOpen)).forEach((p) => {
    const st = S.stats(p);
    const eco = p.design.os === 'own' ? S.ecoFactor() : 0.5;
    const os = p.design.os === 'own' ? -1.7 * (1 - eco) + 0.45 * eco : 0;
    const age = p.status === 'onsale' ? G.t - p.releaseT : 0;
    prods.push({ who: 'player', p, price: p.price, s: st.qual.s, q: st.qual.q, rep: G.rep / 100, hype: p.hype, age, os, aware: (reg) => G.regions[reg].aware, dist: (reg) => S.coverage(reg), form: p.design.form, pre: p.status === 'announced' });
  });
  return prods;
};
S.runMarket = () => {
  const fy = S.fy(), y = S.year(), m = G.t % 12;
  const monthly = D.unitsPerYear(y) / 12 * D.season[m] * (G.world.recession > 0 ? 0.82 : 1);
  const refs = S.segRefs();
  const prods = S.marketProducts();
  prods.forEach((p) => { p.sales = 0; p.byReg = {}; });
  const brandUnits = {};
  const playerPriceF = G.co.strategy === 'premium' ? 0.85 : 1;
  D.regionIds.forEach((reg) => {
    const R = D.regions[reg];
    const regUnits = monthly * S.regionShare(reg, fy);
    D.segments.forEach((seg, si) => {
      const segUnits = regUnits * R.mix[si];
      const ref = refs[seg.id], expQ = refs[seg.id + 'Q'];
      S.TYPES.forEach((ty) => {
        const units = segUnits * ty.share;
        let tot = 0, rivalTot = 0;
        const ws = [];
        prods.forEach((pr) => {
          const lr = Math.log(pr.price / ref);
          const mem = Math.exp(-(lr * lr) / (2 * 0.36 * 0.36));
          if (mem < 0.015) return;
          const aw = pr.aware(reg) * pr.dist(reg);
          if (aw <= 0.0005) return;
          let qk = 0; Object.keys(ty.w).forEach((k) => (qk += ty.w[k] * pr.s[k])); qk *= 100;
          let u = 4.5 * (qk - expQ) / 100 - seg.elast * R.sens * (pr.who === 'player' ? playerPriceF : 1) * lr + (1.8 + 0.35 * si) * pr.rep + 1.2 * pr.hype / 100 - 0.035 * pr.age + pr.os;
          if (pr.form === 'rugged') u += ty.id === 'rugged' ? 2.2 : -0.6;
          if (pr.form === 'fold') u += ty.id === 'general' ? 0.25 : 0;
          if (pr.who === 'player' && reg === G.co.market) u += 0.25; // home advantage
          const w = mem * Math.exp(u) * aw;
          ws.push([pr, w]); tot += w; if (pr.who !== 'player') rivalTot += w;
        });
        const other = 0.3 * rivalTot + 0.02;
        ws.forEach(([pr, w]) => { const s = units * w / (tot + other); pr.sales += s; pr.byReg[reg] = (pr.byReg[reg] || 0) + s; });
      });
    });
  });
  let totalMarket = monthly;
  prods.forEach((pr) => { brandUnits[pr.who] = (brandUnits[pr.who] || 0) + pr.sales; });
  return { prods, brandUnits, totalMarket };
};

/* ---------------- the monthly tick ---------------- */
S.tick = () => {
  if (G.gameOver) return;
  const L = G.ledger;
  const fy = S.fy();
  const report = { completed: [], sales: {}, warnings: [] };
  // --- research & development
  S.allocateRP(true);
  G.research.active.slice().forEach((a) => { if (a.prog >= a.need - 0.01) { G.research.active = G.research.active.filter((x) => x !== a); S.completeTech(a.id); report.completed.push(a.id); } });
  G.phones.filter((p) => p.status === 'dev' && p.devProg >= p.devNeed - 0.01).forEach((p) => { p.status = 'ready'; S.news('✅ <b>' + U.esc(p.name) + '</b> development finished! Plan a launch event or release it quietly from the LAUNCH tab.', 'good'); report.completed.push(p.name); });
  G.chips.forEach((c) => {
    if (c.status === 'dev' && c.devProg >= c.devNeed - 0.01) {
      const cost = S.tapeoutCost(c.spec);
      if (G.cash >= cost) {
        S.spend(cost, 'research');
        S.licenseNeeds(c.spec).forEach(([k, g]) => (G.licenses[k + g] = true));
        c.status = 'fab'; c.fabMonths = 3; c.maskPaid = cost;
        S.news('📤 <b>' + U.esc(c.name) + '</b> taped out (' + U.money(cost) + ' masks & licenses). First silicon in 3 months.', 'good');
      } else if (!c.waitWarned) { c.waitWarned = true; S.news('⏸️ <b>' + U.esc(c.name) + '</b> is ready to tape out but needs ' + U.money(cost) + ' for masks & licenses.', 'bad'); }
    } else if (c.status === 'fab') {
      c.fabMonths--;
      if (c.fabMonths <= 0) {
        const bug = U.chance(0.12 + (S.has('ipreuse') ? -0.05 : 0) + (c.spec.cpuCustom ? 0.05 : 0));
        if (bug) { c.status = 'fab'; c.fabMonths = 3; const re = M.maskCost(D.node(c.spec.node), fy) * 0.35; S.spend(re, 'research'); S.news('🐞 Silicon bug found in <b>' + U.esc(c.name) + '</b>! Metal-layer respin: ' + U.money(re) + ', +3 months.', 'bad'); }
        else { c.status = 'ready'; c.readyT = G.t; G.patents += 5; S.news('🧠 <b>' + U.esc(c.name) + '</b> first silicon works! Your own chip is ready for phones.', 'big'); if (!G.milestones.firstChip) { G.milestones.firstChip = G.t; G.invConf = Math.min(100, G.invConf + 6); } }
      }
    }
  });
  // --- staff dynamics
  const trainF = 1 + Math.min(1.5, G.training / Math.max(1, S.engineers() * 400));
  S.ENG.forEach((f) => {
    const s = G.staff[f];
    const prom = (from, to, p) => { let n = 0; for (let i = 0; i < s[from]; i++) if (U.chance(p * trainF)) n++; s[from] -= n; s[to] += n; return n; };
    prom('senior', 'principal', 0.003); prom('mid', 'senior', 0.009); prom('junior', 'mid', 0.016);
    D.tiers.forEach((t) => { let q = 0; for (let i = 0; i < s[t.id]; i++) if (U.chance(0.004 + (G.morale < 40 ? 0.02 : 0) + (G.salaryLevel < 1 ? 0.008 : 0))) q++; if (q) { s[t.id] -= q; if (q >= 2 || t.id !== 'junior') S.news('👋 ' + q + ' ' + t.name.toLowerCase() + ' ' + D.FIELDS[f].name.toLowerCase() + ' engineer' + (q > 1 ? 's' : '') + ' quit.', 'bad'); } });
  });
  G.morale = U.clamp(G.morale + (G.salaryLevel - 1) * 8 + (62 - G.morale) * 0.05 + (G.training > 0 ? 0.8 : 0), 5, 100);
  G.flags.hiredThisMonth = 0;
  // --- facilities & fabs
  G.facilities.forEach((f) => { if (f.building > 0) { f.building--; if (f.building === 0) S.news('🏭 Your new <b>' + D.facT(f.type).name + '</b> is operational.', 'good'); } });
  G.fabs.forEach((f) => { if (f.building > 0) { f.building--; if (!f.building) S.news('🏭 ' + D.node(f.node).nm + ' fab is producing wafers!', 'big'); } else f.exp++; });
  // --- regions entering
  D.regionIds.forEach((r) => { const R = G.regions[r]; if (R.entering > 0) { R.entering--; if (!R.entering) { R.entered = true; R.aware = Math.max(R.aware, 0.005); S.news('🌍 You can now sell in <b>' + D.regions[r].name + '</b>.', 'good'); } } });
  // --- scheduled releases of announced phones
  G.phones.filter((p) => p.status === 'announced' && p.releaseAt <= G.t).forEach((p) => S.releasePhone(p));
  // --- production
  S.produce(report);
  // --- market & sales
  const mk = S.runMarket();
  S.applySales(mk, report);
  // --- operating costs are settled after this month's sales
  S.spend(S.payroll(), 'salaries');
  if (G.training > 0) S.spend(G.training, 'salaries');
  S.spend(S.facilityOpex(), 'facilities');
  S.spend(S.fabOpex(), 'fabs');
  // --- marketing & awareness
  S.updateBrand(mk);
  // --- contracts
  S.runContracts();
  // --- services, patents, chip sales, foundry
  S.otherIncome(mk);
  // --- loans
  G.loans.slice().forEach((l) => {
    const interest = l.left * l.rate / 12, principal = Math.min(l.left, l.payment - interest);
    S.spend(interest, 'interest'); G.cash -= principal; L.principal += principal; l.left -= principal;
    if (l.left <= 1) { G.loans = G.loans.filter((x) => x !== l); S.news('🏦 Loan fully repaid.', 'good'); }
  });
  // --- taxes
  const opProfit = U.sum(Object.values(L.rev)) - U.sum(Object.values(L.cost)) + L.cost.expansion;
  if (opProfit > 0) { const taxable = Math.max(0, opProfit - G.lossCF); G.lossCF = Math.max(0, G.lossCF - opProfit); if (taxable > 0) S.spend(taxable * S.country().tax, 'taxes'); } else G.lossCF += -opProfit;
  // --- rivals
  S.updateRivals(mk);
  // --- world
  S.worldEvents();
  // --- investors
  G.invConf = U.clamp(G.invConf + (50 - G.invConf) * 0.03, 0, 100);
  S.genOffers();
  S.genContracts(false);
  // --- history
  const rev = U.sum(Object.values(L.rev)), cost = U.sum(Object.values(L.cost)) - L.cost.expansion;
  const share = mk.brandUnits.player ? mk.brandUnits.player / mk.totalMarket : 0;
  G.share.player = share;
  if (G.equity.public) S.updateStock(rev - cost);
  const val = S.companyValue();
  G.hist.push({ t: G.t, cash: G.cash, rev, cost, profit: rev - cost, units: L.units, produced: L.produced, share, rep: G.rep, val, ledger: L, staff: S.totalStaff() });
  if (G.hist.length > 600) G.hist.shift();
  S.milestones(val, share);
  // --- insolvency
  if (G.cash < 0) {
    const lim = S.creditLimit();
    const need = -G.cash + 5000 * S.infl();
    if (lim >= need * 0.6) { S.takeLoan(need, 12, true); G.insolvent = 0; }
    else {
      G.insolvent++;
      if (G.insolvent >= 2) { G.gameOver = true; S.news('💀 ' + G.co.name + ' has gone bankrupt.', 'bad'); }
      else S.queue({ kind: 'insolvent' });
    }
  } else G.insolvent = 0;
  G.ledger = S.blankLedger();
  G.t++;
  // yearly news on nodes
  D.nodes.forEach((n) => { if (!G.world.nodeNews[n.id] && S.fy() >= n.year && n.year > 2010) { G.world.nodeNews[n.id] = 1; S.news('⚙️ Formosa Silicon begins mass production on <b>' + n.nm + '</b>.', 'industry'); } });
  if (G.t % 12 === 0) S.news('📅 Happy new year ' + S.year() + '! New chips from Quantic, MediaCore, Exyra and Unicell hit the market.', 'industry');
  return report;
};

// suppliers ship on net-30 terms: production may dip below zero cash, settled by this month's sales
S.supplierCredit = () => Math.max(12000 * S.infl(), U.avg(G.hist.slice(-3), (h) => h.ledger.rev.phones) * 0.6) * (G.rep < 5 ? 0.6 : 1);
S.produce = (report) => {
  const L = G.ledger;
  const { cap, defect } = S.capacity();
  let free = cap;
  // assembly contracts first
  G.contracts.active.filter((c) => c.type === 'assembly').forEach((c) => { const u = Math.min(free, c.units); free -= u; c.done = (c.done || 0) + u; c.thisMonth = u; });
  const ctx = S.ctx();
  G.phones.filter((p) => p.status !== 'dev' && p.status !== 'retired').forEach((p) => {
    let target = p.target || 0;
    if (p.auto) { const last = (p.salesHist[p.salesHist.length - 1] || {}).demand || 0; target = Math.max(0, Math.round(Math.max(last, p.backlog * 0.6) * 1.15 - (G.inventory[p.id] || 0) * 0.6)); }
    if (target <= 0 || free <= 0) return;
    const st = S.stats(p);
    const unit = st.bom;
    const affordable = Math.floor(Math.max(0, G.cash + S.supplierCredit()) / unit);
    let units = Math.min(target, free, affordable);
    if (units < target && affordable < target && !p._cashWarn) { report.warnings.push('Cash limited production of ' + p.name); }
    if (units <= 0) return;
    // own-chip supply through foundry/fab
    if (p.chipSource === 'own') { const c = S.chipById(p.chipId); if (c) { c.made = (c.made || 0) + units; } }
    free -= units;
    S.spend(units * unit, 'bom');
    const bad = Math.round(units * defect);
    G.inventory[p.id] = (G.inventory[p.id] || 0) + units - bad;
    p.defectRate = defect;
    L.produced += units - bad;
    p.producedTotal = (p.producedTotal || 0) + units - bad;
  });
  G.flags.lastCap = cap; G.flags.lastFree = free;
};

S.applySales = (mk, report) => {
  const L = G.ledger;
  mk.prods.filter((pr) => pr.who === 'player').forEach((pr) => {
    const p = pr.p;
    let demand = pr.sales;
    if (pr.pre) { // preorders accumulate until release
      p.backlog += demand * 0.7; p.preorders = (p.preorders || 0) + demand * 0.7;
      p.salesHist.push({ t: G.t, units: 0, demand: Math.round(demand), rev: 0, pre: true });
      return;
    }
    const want = demand + p.backlog;
    const inv = G.inventory[p.id] || 0;
    const sold = Math.floor(Math.min(want, inv));
    const fromBacklog = Math.min(p.backlog, sold);
    p.backlog = Math.max(0, (p.backlog - fromBacklog) * 0.75 + Math.max(0, demand - (sold - fromBacklog)) * 0.35);
    if (want > inv * 1.5 && want > 200 && !p._soldOutT) { p._soldOutT = G.t; p.hype = Math.min(100, p.hype + 6); S.news('🔥 <b>' + U.esc(p.name) + '</b> is SOLD OUT! Customers are waiting (' + U.num(want - inv) + ' units of unmet demand).', 'good'); }
    if (want <= inv) p._soldOutT = null;
    G.inventory[p.id] = inv - sold;
    // revenue by region share of demand
    let rev = 0;
    const tot = U.sum(Object.values(pr.byReg)) || 1;
    Object.keys(pr.byReg).forEach((r) => { rev += sold * (pr.byReg[r] / tot) * p.price * (1 - S.channelMargin(r)); });
    const royalty = sold * p.price * (G.patents >= 300 ? 0.01 : 0.022);
    const warranty = sold * (p.defectRate || 0.04) * 0.18 * 45 * S.infl();
    // freight, packaging, accessories, duties; plus support/admin/legal/IT overhead that scales with sales
    const logistics = sold * (6 * S.infl() + 0.05 * p.price) * (S.has('scm2') ? 0.9 : 1);
    const overhead = rev * 0.14 * (G.co.strategy === 'lean' ? 0.85 : 1);
    S.earn(rev, 'phones'); S.spend(royalty, 'royalties'); S.spend(warranty, 'warranty'); S.spend(logistics, 'logistics'); S.spend(overhead, 'overhead');
    p.sold += sold; p.revenue += rev; L.units += sold; G.unitsTotal += sold; G.revenueTotal += rev;
    G.installedBase = G.installedBase * (1 - 1 / 42) + sold;
    if (p.design.os === 'own') G.ownBase = G.ownBase * (1 - 1 / 42) + sold;
    p.salesHist.push({ t: G.t, units: sold, demand: Math.round(demand), rev });
    if (p.salesHist.length > 120) p.salesHist.shift();
    report.sales[p.id] = sold;
    p.lastByReg = pr.byReg;
  });
  // retired phones: liquidate
  G.phones.filter((p) => p.status === 'retired' && G.inventory[p.id] > 0).forEach((p) => { const u = G.inventory[p.id]; S.earn(u * p.price * 0.35, 'other'); G.inventory[p.id] = 0; S.news('🏷️ Liquidated ' + U.num(u) + ' leftover ' + U.esc(p.name) + ' units.', 'info'); });
  // hype decay
  G.phones.forEach((p) => { p.hype *= p.status === 'announced' ? 0.92 : 0.82; });
  // rivals unit share
  G.rivals.forEach((r) => { r.lastUnits = mk.brandUnits[r.id] || 0; r.share = r.lastUnits / mk.totalMarket; });
};

S.updateBrand = (mk) => {
  const mktF = 1 + Math.min(1, G.staff.mkt * 0.025);
  const womF = G.co.strategy === 'value' ? 1.3 : G.co.strategy === 'lean' ? 0.85 : 1;
  const regSales = {};
  mk.prods.filter((p) => p.who === 'player').forEach((pr) => Object.keys(pr.byReg).forEach((r) => (regSales[r] = (regSales[r] || 0) + pr.byReg[r])));
  const monthly = mk.totalMarket;
  D.regionIds.forEach((r) => {
    const R = G.regions[r];
    const spend = R.entered ? R.mkt || 0 : 0;
    if (spend > 0) S.spend(spend, 'marketing');
    const scale = D.regions[r].ad * 1e6 * S.infl();
    const ad = 0.12 * Math.sqrt(spend / scale) * mktF;
    const wom = (regSales[r] || 0) / (monthly * S.regionShare(r, S.fy())) * 2.5 * womF;
    R.aware = U.clamp(R.aware + (ad + wom) * (1 - R.aware) - 0.015 * R.aware, 0, 0.98);
  });
  // reputation drifts toward customer satisfaction
  const onsale = G.phones.filter((p) => p.status === 'onsale' && p.sold > 0);
  if (onsale.length) {
    let wsum = 0, ssum = 0;
    onsale.forEach((p) => {
      const st = S.stats(p), fair = S.fairPrice(st.qual.q);
      const sat = U.clamp(40 + (fair / p.price - 1) * 45 + (st.qual.q - 50) * 0.5 + ((p.reviewAvg || 6) - 6) * 6 - (p.defectRate || 0.05) * 150, 0, 100);
      const w = Math.max(1, (p.salesHist[p.salesHist.length - 1] || {}).units || 1);
      wsum += w; ssum += sat * w;
    });
    const target = ssum / wsum;
    const speed = 0.025 * (G.co.strategy === 'premium' ? 1.2 : 1) * (S.has('os_updates') ? 1.2 : 1) * (S.has('cloud') ? 1.15 : 1);
    G.rep = U.clamp(G.rep + (target - G.rep) * speed * (target > G.rep ? 1 : 0.6), 0, 100);
  } else G.rep = Math.max(0, G.rep - 0.05);
};

S.runContracts = () => {
  G.contracts.active.slice().forEach((c) => {
    c.left--;
    if (c.type === 'assembly') {
      const done = c.thisMonth || 0;
      const pay = done * c.pay; S.earn(pay, 'contracts');
      if (done < c.units * 0.98) { const pen = (c.units - done) * c.pay * 0.6; S.spend(pen, 'other'); S.news('⚠️ Missed ' + c.client + ' assembly quota by ' + U.num(c.units - done) + ' units. Penalty ' + U.money(pen) + '.', 'bad'); G.rep = Math.max(0, G.rep - 0.5); }
    } else {
      const del = c.delivered || 0; c.delivered = 0;
      S.earn(del * c.rate, 'contracts');
      if (del < c.rpPerMonth * 0.9) { S.news('⚠️ ' + c.client + ' consulting fell short (' + Math.round(del) + '/' + c.rpPerMonth + ' RP).', 'bad'); }
    }
    if (c.left <= 0) { G.contracts.active = G.contracts.active.filter((x) => x !== c); S.news('📝 Contract with ' + c.client + ' completed.', 'info'); }
  });
};

S.otherIncome = (mk) => {
  const infl = S.infl();
  if (S.has('appstore')) S.earn(G.ownBase * 0.22 * (S.has('cloud') ? 2 : 1) * infl, 'services');
  if (G.patents > 60 && G.flags.licensePatents) S.earn(G.patents * 120 * infl, 'patents');
  // external chip sales
  G.chips.filter((c) => c.status === 'ready' && c.sell).forEach((c) => {
    const tierChips = M.socMarket(S.fy());
    const st = M.chipStats(c.spec, S.fy(), S.chipOpts());
    const cost = S.chipUnitCost(c);
    const price = cost * 1.7;
    const best = U.maxBy(tierChips, (x) => { const s = M.chipStats(x, S.fy()); return Math.pow(s.single, 0.4) * Math.pow(s.gflops, 0.4) / Math.pow(M.socPrice(x, S.fy()), 0.6); });
    const bs = M.chipStats(best, S.fy());
    const rel = (Math.pow(st.single, 0.4) * Math.pow(st.gflops, 0.4) / Math.pow(price, 0.6)) / (Math.pow(bs.single, 0.4) * Math.pow(bs.gflops, 0.4) / Math.pow(M.socPrice(best, S.fy()), 0.6));
    const units = Math.max(0, mk.totalMarket * 0.02 * Math.pow(U.clamp(rel, 0, 2), 3) * (0.3 + G.rep / 100)) ;
    if (units > 100) { S.earn(units * price, 'chips'); S.spend(units * cost, 'bom'); c.extSold = (c.extSold || 0) + units; c.extLast = units; } else c.extLast = 0;
  });
  // fab spare capacity → foundry business
  G.fabs.filter((f) => f.building <= 0 && f.foundry).forEach((f) => {
    const node = D.node(f.node);
    const used = U.sum(G.chips.filter((c) => c.spec.node === f.node), (c) => { const st = M.chipStats(c.spec, S.fy()); const m = (c.made || 0); c.made = 0; return m / Math.max(1, st.dpw * st.yield); });
    const spare = Math.max(0, f.wafers - used);
    const demand = spare * U.clamp(0.25 + G.rep / 200 - Math.max(0, S.fy() - node.year - 4) * 0.05, 0.05, 0.9);
    const price = M.waferPrice(node, S.fy(), D.foundries[1]) * 0.85;
    S.earn(demand * price, 'foundry'); S.spend(demand * price * 0.45, 'fabs');
    f.lastFoundry = demand;
  });
};

S.updateRivals = (mk) => {
  const fy = S.fy(), m = G.t % 12;
  G.rivals.forEach((r) => {
    const rv = S.rivalDef(r.id);
    if (!r.alive) return;
    if (!r.started && fy >= rv.start) { r.started = true; if (rv.start > 2010) { S.rivalLaunch(r, fy, false); S.news('🆕 New competitor <b>' + rv.name + '</b> enters the smartphone market.', 'rival'); } }
    if (fy < rv.start) return;
    if (m === rv.month && G.t > 0) S.rivalLaunch(r, fy, false);
    // regional growth
    if (rv.grow && m === 0) D.regionIds.forEach((reg) => (r.presence[reg] = Math.min(0.95, (r.presence[reg] || 0) + rv.grow * (0.5 + Math.random()))));
    // reputation drift toward product quality
    const qs = r.phones.map((ph) => S.rivalPhoneQ(ph).q);
    if (qs.length) r.rep = U.clamp(r.rep + ((U.avg(qs) - 40) * 1.1 - r.rep) * 0.01, 5, 98);
    // exits
    if (rv.exitBelow && fy > 2014 && r.share < rv.exitBelow && U.chance(0.04)) { r.alive = false; S.news('🪦 <b>' + rv.name + '</b> exits the phone business after years of decline.', 'big'); }
    // price cuts with age
    r.phones.forEach((ph) => { const age = fy - ph.launchFy; if (age > 0.5 && ph.cut < 1) { ph.price = Math.round(ph.launchPrice * 0.88 / 10) * 10 - 1; ph.cut = 1; } else if (age > 1.1 && ph.cut < 2) { ph.price = Math.round(ph.launchPrice * 0.75 / 10) * 10 - 1; ph.cut = 2; } });
  });
  // rivals react to a hot player product
  G.phones.filter((p) => p.status === 'onsale').forEach((p) => {
    const st = S.stats(p);
    const t = S.tierOfPrice(p.price);
    const hot = p.hype > 55 || (p.salesHist.length && (p.salesHist[p.salesHist.length - 1].units / Math.max(1, mk.totalMarket)) > 0.01);
    if (!hot) return;
    const cands = G.rivals.filter((r) => r.alive && !r.reacted[p.id] && r.phones.some((ph) => ph.tier === t));
    if (!cands.length || !U.chance(0.35)) return;
    const r = U.pick(cands); r.reacted[p.id] = true;
    const ph = U.maxBy(r.phones.filter((x) => x.tier === t), (x) => x.launchFy);
    ph.price = Math.round(ph.price * 0.88 / 10) * 10 - 1; ph.launchPrice = Math.max(ph.price, ph.launchPrice * 0.9);
    S.news('⚔️ ' + S.rivalDef(r.id).name + ' responds to <b>' + U.esc(p.name) + '</b>: ' + ph.name + ' price cut to ' + U.money(ph.price) + '.', 'rival');
  });
};

S.updateStock = (profit) => {
  const fundamental = S.valuation();
  const prev = G.equity.mcap || fundamental;
  const drift = (fundamental - prev) / prev * 0.25;
  const noise = U.gauss() * 0.045;
  G.equity.mcap = Math.max(1e6, prev * (1 + drift + noise + (G.invConf - 50) / 2500));
  G.equity.price = G.equity.mcap / G.equity.shares;
  G.equity.priceHist.push({ t: G.t, p: G.equity.price });
  if (G.equity.priceHist.length > 400) G.equity.priceHist.shift();
};

  if (!G.flags.tariff18 && fy >= 2018.5) { G.flags.tariff18 = 1; W.tariff = 18; S.news('🧾 Trade war: new tariffs on electronics between the US and China.', 'industry'); }
  if (U.chance(0.006)) { W.shortage = U.ri(4, 9); S.news('⚠️ Factory fire at a major supplier — component prices spike.', 'industry'); }
  if (U.chance(0.004) && fy > 2011) { W.recession = U.ri(4, 8); S.news('📉 Economic downturn: consumers delay phone upgrades.', 'industry'); }
  // company events
  const sold6 = U.sum(G.hist.slice(-6), (h) => h.units);

  if (S.annualRevenue() > 2e7 * S.infl() && U.chance(0.012 * (1 + Math.max(0, 150 - G.patents) / 100))) S.queue({ kind: 'lawsuit' });
  if (S.headcount('hw') + S.headcount('sil') + S.headcount('sw') > 6 && U.chance(0.02)) S.queue({ kind: 'poach' });

  if (G.phones.some((p) => p.status === 'onsale' && p.benchBoost) && U.chance(0.05)) S.queue({ kind: 'benchcaught' });
  if (G.phones.some((p) => p.status === 'onsale') && G.rep > 25 && U.chance(0.015)) S.queue({ kind: 'carrierdeal' });
};

/* ---------------- design templates for the player ---------------- */
S.availableSoCs = () => M.socMarket(S.fy()).slice().sort((a, b) => M.socPrice(a, S.fy()) - M.socPrice(b, S.fy()));
S.template = (kind = 'mid', chip = null) => {
  const fy = S.fy(), has = S.has, ctx = { fy, has };
  const tier = { budget: 'budget', mid: 'mid', rugged: 'budget', gaming: 'premium', camera: 'mid', flagship: 'flagship', premium: 'premium' }[kind] || 'mid';
  const ti = M.TI[tier];
  const socs = S.availableSoCs();
  if (!chip) {
    const pool = socs.filter((c) => c.tier === tier);
    const val = (c) => { const cs = M.chipStats(c, fy); return Math.pow(cs.single, 0.5) * Math.pow(cs.gflops, 0.3) / Math.pow(M.socPrice(c, fy), 0.55); };
    chip = (kind === 'gaming' ? U.maxBy(socs.filter((c) => c.tier !== 'flagship'), (c) => M.chipStats(c, fy).gflops) : U.maxBy(pool, val)) || socs[0];
  }
  const okR = D.ram.filter((r) => M.okRam(ctx, r) && chip.memTypes.includes(r.id));
  const ramT = U.maxBy(okR.filter((r) => r.lp), (r) => r.year) || okR[okR.length - 1] || D.ramT(chip.memTypes[0]);
  const ramGB = Math.min(ramT.maxGB, M.snap(D.ramSizes, M.ramNeed(fy) * [0.5, 0.75, 1, 1.25][ti] * (kind === 'gaming' ? 1.4 : 1)));
  const stoT = M.newest(D.storage, (x) => M.okSto(ctx, x)) || D.storage[0];
  const dispT = M.newest(D.dispTypes, (x) => M.okDisp(ctx, x)) || D.dispTypes[0];
  const dType = ti === 0 && dispT.id !== 'tn' ? (D.dispTypes.find((d) => d.id === 'ips' && M.okDisp(ctx, d)) || D.dispTypes[0]) : dispT;
  const resL = D.resolutions.filter((x) => M.ok(ctx, x));
  const res = resL[Math.max(0, resL.length - 1 - (ti === 0 ? 1 : 0))];
  const hzL = D.refresh.filter((x) => M.ok(ctx, x));
  const bezL = D.bezels.filter((x) => M.ok(ctx, x));
  const chem = M.newest(D.batChem, (x) => M.ok(ctx, x));
  const chL = D.charging.filter((x) => M.ok(ctx, x));
  const isp = D.ispGens[chip.ispGen - 1];
  const mpL = D.camMP.filter((x) => M.ok(ctx, x) && x.mp <= isp.maxMP);
  const senL = D.sensors.filter((x) => M.ok(ctx, x));
  const matL = D.materials.filter((x) => M.ok(ctx, x));
  const extras = [];
  if (ti >= 1 && has('cam_dual')) extras.push('ultra');
  if ((ti >= 2 || kind === 'camera') && has('cam_tele')) extras.push('tele');
  if (kind === 'camera' && has('cam_peri')) extras.push('peri');
  const coolL = D.cooling.filter((x) => M.ok(ctx, x) && (x.id !== 'fan' || kind === 'gaming'));
  const modem = chip.modemGen ? 0 : (M.newest(D.modems, (m) => m.g && m.year <= fy) || D.modems[1]).g;
  const d = {
    form: kind === 'rugged' ? 'rugged' : 'bar', modem,
    ram: { type: ramT.id, gb: ramGB, bus: Math.min(chip.memBus, ti >= 2 ? 64 : 32) }, sto: { type: stoT.id, gb: M.snap(D.stoSizes, M.stoNeed(fy) * [0.25, 0.5, 1, 1.6][ti]) },
    disp: { type: dType.id, size: +(M.idealSize(fy) * (kind === 'gaming' ? 1.05 : 1)).toFixed(1), res: res.id, hz: (kind === 'gaming' ? hzL[hzL.length - 1] : hzL[Math.max(0, hzL.length - 1 - (ti < 2 ? 1 : 0))]).hz, bezel: bezL[bezL.length - 1].id },
    bat: { chem: chem.id, mah: Math.round((1300 + 230 * (fy - 2010)) * (kind === 'rugged' ? 1.5 : kind === 'gaming' ? 1.2 : 1) / 50) * 50, charge: chL[chL.length - 1].w, wless: ti >= 2 ? (M.newest(D.wireless, (w) => M.ok(ctx, w)) || D.wireless[0]).id : 'none' },
    cam: { mp: mpL[mpL.length - 1].mp, sensor: senL[Math.max(0, senL.length - 1 - (ti === 0 ? 1 : 0))].id, ois: has('cam_ois') && ti >= 1, extras, front: (M.newest(D.frontMP, (f) => f.year <= fy) || D.frontMP[1]).mp },
    body: { mat: matL[Math.min(matL.length - 1, ti)].id, ip: kind === 'rugged' ? (has('ip68') ? 'ip68' : has('ip67') ? 'ip67' : 'none') : ti >= 2 ? (M.newest(D.ipRatings, (x) => M.ok(ctx, x)) || D.ipRatings[0]).id : 'none', bio: (M.newest(D.biometrics, (x) => M.ok(ctx, x)) || D.biometrics[0]).id, cooling: coolL[coolL.length - 1].id, jack: true, sd: ti <= 1, stereo: has('stereo') && (ti >= 2 || kind === 'gaming') },
    os: 'open', benchBoost: false,
  };
  const st = M.phoneStats({ ...d, chip, chipSource: 'market' }, fy, S.ctx());
  d.price = Math.max(79, Math.round(st.bom * (kind === 'budget' ? 1.7 : 1.9) / 10) * 10 - 1);
  return { design: d, chip };
};

UI.chartId = 0;
UI.chart = (series, opts = {}) => {
  const id = 'ch' + (++UI.chartId);

  return '<canvas class="chart" id="' + id + '" style="height:' + (opts.h || 160) + 'px"></canvas>';
};
UI.drawChart = (cv, series, opts) => {
  if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  const pad = { l: 46, r: 8, t: 10, b: 20 };
  const all = series.flatMap((s) => s.data.map((d) => d[1]));
  if (!all.length) { x.fillStyle = '#5b6880'; x.font = '12px sans-serif'; x.fillText('No data yet', W / 2 - 30, H / 2); return; }
  let mn = Math.min(0, ...all), mx = Math.max(...all, opts.min ?? 0);
  if (mx === mn) mx = mn + 1;
  const xs = series.flatMap((s) => s.data.map((d) => d[0]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  const px = (v) => pad.l + (v - x0) / (x1 - x0) * (W - pad.l - pad.r), py = (v) => pad.t + (1 - (v - mn) / (mx - mn)) * (H - pad.t - pad.b);
  x.strokeStyle = 'rgba(255,255,255,0.06)'; x.fillStyle = '#5b6880'; x.font = '10px sans-serif'; x.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4, y = py(v); x.beginPath(); x.moveTo(pad.l, y); x.lineTo(W - pad.r, y); x.stroke(); x.fillText((opts.fmt || U.num)(v), 2, y + 3); }
  if (mn < 0) { x.strokeStyle = 'rgba(255,255,255,0.25)'; x.beginPath(); x.moveTo(pad.l, py(0)); x.lineTo(W - pad.r, py(0)); x.stroke(); }
  if (opts.xlab) { x.fillStyle = '#5b6880'; x.fillText(opts.xlab(x0), pad.l, H - 4); const t = opts.xlab(x1); x.fillText(t, W - pad.r - x.measureText(t).width, H - 4); }
  series.forEach((s) => {
    if (s.bars) {
      const bw = Math.max(1, (W - pad.l - pad.r) / Math.max(1, s.data.length) - 1);
      s.data.forEach(([a, b]) => { x.fillStyle = b >= 0 ? (s.color || '#3ee6ff') : '#ff4d6a'; const y0 = py(0), y = py(b); x.fillRect(px(a) - bw / 2, Math.min(y, y0), bw, Math.abs(y - y0)); });
      return;
    }
    x.strokeStyle = s.color || '#3ee6ff'; x.lineWidth = s.w || 2; x.beginPath();
    s.data.forEach(([a, b], i) => (i ? x.lineTo(px(a), py(b)) : x.moveTo(px(a), py(b))));
    x.stroke();
    if (s.fill) { x.lineTo(px(s.data[s.data.length - 1][0]), py(mn)); x.lineTo(px(s.data[0][0]), py(mn)); x.closePath(); const g = x.createLinearGradient(0, pad.t, 0, H); g.addColorStop(0, s.color + '55'); g.addColorStop(1, s.color + '00'); x.fillStyle = g; x.fill(); }
  });
  if (opts.legend) { let lx = pad.l + 4; series.forEach((s) => { x.fillStyle = s.color; x.fillRect(lx, pad.t, 8, 8); x.fillStyle = '#c9d4e5'; x.fillText(s.name, lx + 11, pad.t + 8); lx += x.measureText(s.name).width + 24; }); }
};

/* ================= HQ ================= */
UI.pages.hq = () => {
  const h = G.hist[G.hist.length - 1] || { rev: 0, profit: 0, units: 0 };
  const burn = U.avg(G.hist.slice(-3), (x) => x.profit);
  const runway = !G.hist.length ? 'starting capital' : burn < 0 ? (G.cash / -burn).toFixed(1) + ' mo runway' : 'cash-flow positive';
  const al = UI.alerts().list;
  let s = H.title('🏢', 'Headquarters', U.esc(G.co.name) + ' · ' + S.country().flag + ' ' + S.country().name + ' · ' + U.dateStr(G.t));
  if (al.length) s += '<div class="card">' + al.map(([c, t, tab]) => '<div class="row" style="padding:5px 0;cursor:pointer" data-a="go" data-t="' + tab + '"><span class="tag ' + c + '">' + (c === 'bad' ? '!' : c === 'good' ? '✓' : '•') + '</span><span class="grow small">' + t + '</span><span class="dim">›</span></div>').join('') + '</div>';
  s += '<div class="kpis">' +
    H.kpi('Cash', U.money(G.cash), runway, G.cash < 0 ? 'bad' : '') +
    H.kpi('Last month', U.money(h.profit), 'revenue ' + U.money(h.rev), h.profit >= 0 ? 'good' : 'bad') +
    H.kpi('Phones sold', U.num(h.units), U.num(G.unitsTotal) + ' all-time') +
    H.kpi('Market share', U.pct(G.share.player, 3), 'of ' + U.num(D.unitsPerYear(S.year()) / 12) + '/mo global') +
    H.kpi('Reputation', G.rep.toFixed(0) + '<span class="small mute">/100</span>', U.stars(G.rep)) +
    H.kpi('Company value', U.money(S.companyValue()), S.stage(S.companyValue()) + ' · you own ' + U.pct(S.ownership(), 1)) +
    H.kpi('Team', S.totalStaff(), S.engineers() + ' engineers') +
    H.kpi('Capacity', U.num(S.capacity().cap) + '/mo', 'defects ' + U.pct(S.capacity().defect)) + '</div>';
  // products
  const prods = G.phones.filter((p) => p.status !== 'retired');
  s += '<div class="card"><h3>📱 Product line <span class="r"><button class="btn sm pri" data-a="go" data-t="design">+ New phone</button></span></h3>';
  if (!prods.length) s += '<div class="empty"><div class="e">📐</div>No phones yet. Your first design is waiting.<div class="mt12"><button class="btn pri" data-a="newPhone">Design your first phone</button></div></div>';
  else s += '<div class="list">' + prods.map((p) => {
    const last = p.salesHist[p.salesHist.length - 1];
    const sub = p.status === 'dev' ? 'Development ' + Math.round(p.devProg / p.devNeed * 100) + '%' : p.status === 'onsale' ? U.num(last ? last.units : 0) + ' sold last month · stock ' + U.num(G.inventory[p.id] || 0) : p.status === 'announced' ? 'Preorders ' + U.num(p.preorders || 0) + ' · stock ' + U.num(G.inventory[p.id] || 0) : 'Stock ' + U.num(G.inventory[p.id] || 0);
    return '<div class="it" style="cursor:pointer" data-a="phoneInfo" data-id="' + p.id + '">' + H.phoneIcon(p) + '<div class="grow"><div class="row"><b class="ellip">' + U.esc(p.name) + '</b>' + H.statusTag(p) + '</div><div class="small mute">' + U.money(p.price) + ' · ' + sub + '</div></div>' + (p.hype > 5 ? '<span class="tag gold">🔥 ' + p.hype.toFixed(0) + '</span>' : '') + '</div>';
  }).join('') + '</div>';
  s += '</div>';
  if (G.hist.length > 1) {
    s += '<div class="card"><h3>📈 Cash & revenue</h3>' + UI.chart([{ name: 'Cash', color: '#3ee6ff', data: H.histSeries('cash'), fill: true }, { name: 'Revenue', color: '#3ddc84', data: H.histSeries('rev') }, { name: 'Costs', color: '#ff4d6a', data: H.histSeries('cost') }], { fmt: (v) => U.money(v, 0), legend: true, xlab: U.dateStr }) + '</div>';
  }
  s += '<div class="card"><h3>📰 News</h3><div class="news">' + G.news.slice(0, 30).map((n) => '<div class="n ' + n.type + '"><div class="t">' + U.dateStr(n.t) + '</div>' + n.text + '</div>').join('') + '</div></div>';
  return s;
};

/* ================= R&D ================= */
UI.rndFilter = 'all';
UI.pages.rnd = () => {
  const alloc = S.allocateRP(false);
  const pools = alloc.pools;
  let s = H.title('🔬', 'Research & Development', S.engineers() + ' engineers · ' + G.research.active.length + '/' + S.researchSlots() + ' research slots · ' + G.patents + ' patents');
  s += '<div class="card"><h3>⚡ Monthly research output</h3><div class="grid2">' + S.ENG.map((f) => '<div class="specTile"><div class="k">' + D.FIELDS[f].icon + ' ' + D.FIELDS[f].name + '</div><div class="v" style="color:' + D.FIELDS[f].color + '">' + pools[f].toFixed(0) + ' RP</div><div class="tiny mute">' + U.plural(S.headcount(f), 'engineer') + '</div></div>').join('') + '</div></div>';
  // active work
  const items = alloc.items;
  s += '<div class="card"><h3>🛠️ Active projects</h3>';
  if (!items.length) s += '<div class="empty"><div class="e">😴</div>Nothing in progress — your engineers are idle.</div>';
  items.forEach((it) => {
    const ref = it.ref;
    const name = it.kind === 'res' ? D.tech[ref.id].name : it.kind === 'phone' ? '📱 ' + ref.name + ' (phone)' : '🧠 ' + ref.name + ' (chip design)';
    const prog = it.kind === 'res' ? ref.prog / ref.need : ref.devProg / ref.devNeed;
    const need = it.kind === 'res' ? ref.need - ref.prog : ref.devNeed - ref.devProg;
    s += '<div class="techItem active"><div class="row between"><div class="nm grow ellip">' + U.esc(name) + '</div><span class="tag acc">' + it.got.toFixed(0) + ' RP/mo</span></div>' + UI.bar(prog) +
      '<div class="row between small mute mt8"><span>' + Math.round(need) + ' RP left · ETA ' + S.eta(need, it.got) + '</span>' + (it.kind === 'res' ? '<button class="btn xs bad" data-a="cancelRes" data-id="' + ref.id + '">Cancel</button>' : '') + '</div></div>';
  });
  s += '</div>';
  // tech tree
  const flt = UI.rndFilter;
  s += '<div class="seg mb8">' + [['all', 'All']].concat(Object.keys(D.FIELDS).map((f) => [f, D.FIELDS[f].icon + ' ' + D.FIELDS[f].name])).map(([id, n]) => '<button class="' + (flt === id ? 'on' : '') + '" data-a="rndFlt" data-f="' + id + '">' + n + '</button>').join('') +
    '<button class="' + (UI.rndShowDone ? 'on' : '') + '" data-a="rndDone">' + (UI.rndShowDone ? '✓ ' : '') + 'Show completed</button></div>';
  const cats = {};
  D.techs.forEach((t) => {
    if (flt !== 'all' && t.field !== flt) return;
    const st = S.techState(t.id);
    if (st === 'done' && !UI.rndShowDone) return;
    if (st === 'active') return;
    (cats[t.cat] = cats[t.cat] || []).push([t, st]);
  });
  Object.keys(cats).forEach((cat) => {
    const list = cats[cat].sort((a, b) => ({ available: 0, locked: 1, future: 2, done: 3 }[a[1]] - { available: 0, locked: 1, future: 2, done: 3 }[b[1]]) || a[0].year - b[0].year).slice(0, 14);
    s += '<div class="card"><h3>' + cat + '</h3>' + list.map(([t, st]) => {
      const c = S.researchCost(t.id);
      const ahead = c.ahead > 0.05 ? '<span class="tag warn">' + c.ahead.toFixed(1) + ' yrs ahead · ×' + c.mult.toFixed(1) + '</span>' : c.mult < 0.95 ? '<span class="tag good">mature −' + Math.round((1 - c.mult) * 100) + '%</span>' : '';
      const req = t.req.filter((r) => !S.has(r)).map((r) => D.tech[r].name);
      const fp = pools[t.field] / Math.max(1, G.research.active.filter((a) => D.tech[a.id].field === t.field).length + 1);
      return '<div class="techItem ' + st + '"><div class="row between top"><div class="grow"><div class="nm"><span class="fieldDot" style="background:' + D.FIELDS[t.field].color + '"></span> ' + t.name + ' <span class="tiny dim">' + Math.floor(t.year) + '</span></div><div class="small mute">' + t.desc + '</div>' +
        (req.length ? '<div class="tiny warn mt8">Requires: ' + req.join(', ') + '</div>' : '') + (st === 'future' ? '<div class="tiny dim mt8">Too far ahead of the industry (> 4 years).</div>' : '') + '</div></div>' +
        (st === 'done' ? '<div class="tiny good mt8">✓ Researched ' + U.dateStr(G.research.done[t.id]) + '</div>' : '<div class="row between mt8 wrap"><div class="small"><b>' + U.num(c.rp) + ' RP</b> · <b>' + U.money(c.cash) + '</b> ' + ahead + (st === 'available' ? ' <span class="tiny mute">~' + S.eta(c.rp, fp) + '</span>' : '') + '</div>' +
          (st === 'available' ? '<button class="btn sm pri" data-a="startRes" data-id="' + t.id + '">Research</button>' : '') + '</div>') + '</div>';
    }).join('') + '</div>';
  });
  return s;
};

        '<label class="chk"><input type="checkbox" ' + (p.auto ? 'checked' : '') + ' data-ch="prodAuto" data-id="' + p.id + '"> Auto-production (match demand, keep a small buffer)</label></div>';
    });
  } else if (sub === 'fac') {
    G.facilities.forEach((f) => {
      const ft = D.facT(f.type);
      s += '<div class="card"><div class="row between"><div><b>' + ft.name + '</b> ' + (f.building > 0 ? '<span class="tag warn">Under construction · ' + f.building + ' mo</span>' : '') + '<div class="small mute">' + f.lines + '/' + ft.maxLines + ' lines · ' + U.num(f.lines * ft.lineCap * S.autoMult()) + ' units/mo · base defects ' + U.pct(ft.defect) + '</div></div></div>' +
        '<div class="row wrap mt12"><button class="btn sm pri" data-a="addLine" data-id="' + f.id + '" ' + (f.lines >= ft.maxLines ? 'disabled' : '') + '>+ ' + (f.type === 'workshop' ? 'Workstation' : 'Line') + ' (' + U.money(ft.lineCost * S.infl()) + ')</button>' + (G.facilities.length > 1 ? '<button class="btn sm bad" data-a="sellFac" data-id="' + f.id + '">Sell</button>' : '') + '</div></div>';
    });

      const cost = ft.build * S.infl() * (0.6 + 0.4 * S.country().rent) * S.diff().cost;

    }).join('') + '<div class="small mute">Facility opex this month: ' + U.money(S.facilityOpex()) + '</div></div>';
  } else if (sub === 'fab') {

  }
  return s;
};

/* =========================================================
   DESIGN STUDIO — phone renderer, phone designer, chip designer
   ========================================================= */
const R = {};
R.rr = (x, X, Y, W, Hh, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + Hh, r); x.arcTo(X + W, Y + Hh, X, Y + Hh, r); x.arcTo(X, Y + Hh, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); };
R.shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; r = U.clamp(Math.round(r * f), 0, 255); g = U.clamp(Math.round(g * f), 0, 255); b = U.clamp(Math.round(b * f), 0, 255); return 'rgb(' + r + ',' + g + ',' + b + ')'; };
// Draw a phone (front or back) centred at cx,cy. s = pixels per mm.
R.drawPhone = (x, cx, cy, s, d, st, view = 'front', o = {}) => {
  const W = st.bodyW * s, Hh = st.bodyH * s, X = cx - W / 2, Y = cy - Hh / 2;
  const rad = Math.min(W, Hh) * (d.disp.bezel === 'b169' ? 0.13 : 0.16);
  const col = o.color || '#3a4a66', mat = d.body.mat;
  x.save();
  // shadow
  x.shadowColor = 'rgba(0,0,0,0.5)'; x.shadowBlur = 24 * (o.glow ? 1.5 : 1); x.shadowOffsetY = 10;
  if (o.glow) x.shadowColor = o.glow;
  R.rr(x, X, Y, W, Hh, rad);
  const g = x.createLinearGradient(X, Y, X + W, Y + Hh);
  if (view === 'back') {
    const sh = mat === 'plastic' ? [1.05, 0.9] : mat === 'alu' ? [1.25, 0.8] : mat === 'glass' || mat === 'steel' || mat === 'ti' ? [1.45, 0.7] : [1.3, 0.85];
    g.addColorStop(0, R.shade(col, sh[0])); g.addColorStop(0.55, col); g.addColorStop(1, R.shade(col, sh[1]));
  } else { g.addColorStop(0, R.shade(col, 0.55)); g.addColorStop(1, R.shade(col, 0.35)); }
  x.fillStyle = g; x.fill(); x.shadowColor = 'transparent';
  // frame highlight
  x.lineWidth = Math.max(1, s * 0.6); x.strokeStyle = mat === 'steel' ? '#e6e9ef' : mat === 'ti' ? '#b9b4ab' : R.shade(col, 1.5); x.stroke();
  if (d.form === 'rugged') { x.lineWidth = s * 3; x.strokeStyle = '#1b1f27'; R.rr(x, X + s, Y + s, W - 2 * s, Hh - 2 * s, rad * 0.9); x.stroke(); }
  if (view === 'front') {
    const sw = st.sw_in * 25.4 * s * (d.form === 'fold' ? 0.5 : 1), shh = st.sh_in * 25.4 * s;
    const sx = cx - sw / 2, sy = cy - shh / 2 + (d.disp.bezel === 'b169' ? -Hh * 0.0 : 0);
    const srad = d.disp.bezel === 'b169' ? 2 * s : rad * 0.82;
    R.rr(x, sx, sy, sw, shh, srad);
    if (o.screen) { x.save(); x.clip(); o.screen(x, sx, sy, sw, shh); x.restore(); }
    else {
      const wg = x.createLinearGradient(sx, sy, sx + sw, sy + shh);
      wg.addColorStop(0, o.wall1 || '#1b2a5a'); wg.addColorStop(0.6, o.wall2 || '#5a2a7a'); wg.addColorStop(1, '#0a0f1c');
      x.fillStyle = wg; x.fill();
      x.fillStyle = 'rgba(255,255,255,0.85)'; x.font = '700 ' + Math.max(8, sw * 0.16) + 'px sans-serif'; x.textAlign = 'center';
      x.fillText('9:41', cx, sy + shh * 0.25);
    }
    // camera cutouts
    x.fillStyle = '#000';
    if (d.disp.bezel === 'notch') { R.rr(x, cx - sw * 0.22, sy - 1, sw * 0.44, s * 5.5, s * 2.5); x.fill(); }
    else if (d.disp.bezel === 'punch') { x.beginPath(); x.arc(cx, sy + s * 4, s * 1.6, 0, 7); x.fill(); }
    else if (d.disp.bezel === 'b169') { R.rr(x, cx - s * 5, Y + (sy - Y) / 2 - s, s * 10, s * 1.6, s); x.fillStyle = '#222'; x.fill(); x.beginPath(); x.arc(cx, sy + shh + (Y + Hh - sy - shh) / 2, Math.min(s * 4.5, (Y + Hh - sy - shh) * 0.35), 0, 7); x.strokeStyle = '#555'; x.lineWidth = s * 0.5; x.stroke(); }

PS.drawPhoto = () => {
  const p = S.phoneById(PS.id), st = S.stats(p);
  const [x, W, Hh] = PS.ctx('psC');
  const mode = PS.camMode;
  const sub = { day: st.cam.day, night: st.cam.night, zoom: st.cam.zoom, selfie: st.cam.selfie }[mode];
  const qual = U.clamp(sub / 120, 0.05, 1.2);
  const rng = U.srng(42);
  // scene
  const night = mode === 'night';
  const sky = x.createLinearGradient(0, 0, 0, Hh);
  sky.addColorStop(0, night ? '#05061a' : '#5fb3ff'); sky.addColorStop(0.7, night ? '#1b1640' : '#ffd8a8'); sky.addColorStop(1, night ? '#0a0a14' : '#f2a65a');
  x.fillStyle = sky; x.fillRect(0, 0, W, Hh);
  if (night) { x.fillStyle = '#fff'; for (let i = 0; i < 40; i++) x.fillRect(rng() * W, rng() * Hh * 0.5, 1, 1); x.beginPath(); x.arc(W * 0.78, Hh * 0.18, 12, 0, 7); x.fillStyle = '#f5f3d6'; x.fill(); }
  else { x.beginPath(); x.arc(W * 0.8, Hh * 0.2, 16, 0, 7); x.fillStyle = '#fff6c9'; x.fill(); }
  const zoomF = mode === 'zoom' ? 2.2 : 1;
  for (let i = 0; i < 14; i++) {
    const bw = (18 + rng() * 26) * zoomF, bh = (40 + rng() * 120) * zoomF, bx = (i * 26 - (zoomF - 1) * W * 0.5) % (W + 60) - 20;
    x.fillStyle = night ? '#0d0f1d' : R.shade('#3a4a66', 0.7 + rng() * 0.5); x.fillRect(bx, Hh - bh, bw, bh);
    for (let wy = Hh - bh + 6; wy < Hh - 4; wy += 7 * zoomF) for (let wx = bx + 3; wx < bx + bw - 3; wx += 6 * zoomF) if (rng() < (night ? 0.45 : 0.25)) { x.fillStyle = night ? '#ffd36b' : '#cfe6ff'; x.fillRect(wx, wy, 2.5 * zoomF, 3 * zoomF); }
  }
  if (mode === 'selfie') { x.fillStyle = '#f0c8a0'; x.beginPath(); x.arc(W / 2, Hh * 0.55, 42, 0, 7); x.fill(); x.fillStyle = '#2b1a10'; x.beginPath(); x.arc(W / 2, Hh * 0.47, 44, Math.PI, 0); x.fill(); x.fillStyle = '#222'; x.fillRect(W / 2 - 18, Hh * 0.53, 8, 5); x.fillRect(W / 2 + 10, Hh * 0.53, 8, 5); x.fillStyle = '#c0504d'; x.fillRect(W / 2 - 12, Hh * 0.64, 24, 4); }
  // optical degradation driven by the camera sub-score
  const blur = Math.max(0, (1 - qual) * 3.5);
  if (blur > 0.3) { x.filter = 'blur(' + blur.toFixed(1) + 'px)'; x.drawImage(x.canvas, 0, 0, x.canvas.width, x.canvas.height, 0, 0, W, Hh); x.filter = 'none'; }
  const noise = Math.max(0, (1 - qual) * (night ? 0.7 : 0.35));
  if (noise > 0.02) { const img = x.getImageData(0, 0, x.canvas.width, x.canvas.height); const dd = img.data; for (let i = 0; i < dd.length; i += 4) { const n = (Math.random() - 0.5) * 255 * noise; dd[i] += n; dd[i + 1] += n * (0.8 + Math.random() * 0.4); dd[i + 2] += n; } x.putImageData(img, 0, 0); }
  if (night && qual < 0.5) { x.fillStyle = 'rgba(0,0,0,' + (0.5 - qual) + ')'; x.fillRect(0, 0, W, Hh); }
  x.fillStyle = 'rgba(0,0,0,0.5)'; x.fillRect(0, Hh - 18, W, 18); x.fillStyle = '#fff'; x.font = 'bold 10px sans-serif';
  x.fillText((mode === 'selfie' ? p.design.cam.front : st.cam.effMP) + 'MP · ' + mode.toUpperCase() + ' · score ' + sub.toFixed(0), 6, Hh - 6);
  $('#psCRes').innerHTML = 'Overall camera score <b>' + st.cam.score.toFixed(0) + '</b> · day ' + st.cam.day.toFixed(0) + ' · night ' + st.cam.night.toFixed(0) + ' · video ' + st.cam.video.toFixed(0) + ' (' + st.cam.video_res + ') · zoom ' + st.cam.zoom.toFixed(0) + ' · selfie ' + st.cam.selfie.toFixed(0);
};

PS.drawBat = (prog, st) => {
  const [x, W, Hh] = PS.ctx('psBat');
  const maxH = Math.max(12, Math.ceil(st.sot / 2) * 2 + 2);
  x.strokeStyle = 'rgba(255,255,255,0.07)'; x.fillStyle = '#5b6880'; x.font = '9px sans-serif';
  for (let h = 0; h <= maxH; h += 2) { const px = 22 + h / maxH * (W - 30); x.beginPath(); x.moveTo(px, 8); x.lineTo(px, Hh - 16); x.stroke(); x.fillText(h + 'h', px - 5, Hh - 4); }
  const rivals = G.rivals.filter((r) => r.alive).flatMap((r) => r.phones).sort((a, b) => b.st.sot - a.st.sot).slice(0, 3);
  rivals.forEach((ph) => { x.strokeStyle = 'rgba(167,116,255,0.5)'; x.lineWidth = 1; x.beginPath(); x.moveTo(22, 8); x.lineTo(22 + ph.st.sot / maxH * (W - 30), Hh - 16); x.stroke(); });
  const end = st.sot * prog;
  x.strokeStyle = '#3ddc84'; x.lineWidth = 2.5; x.beginPath(); x.moveTo(22, 8); x.lineTo(22 + end / maxH * (W - 30), 8 + (Hh - 24) * prog); x.stroke();
  x.fillStyle = '#fff'; x.font = 'bold 18px sans-serif'; x.fillText(Math.round(100 - prog * 100) + '%', W - 64, 28);
};
UI.A.psBatRun = () => {

    }

};

const MED = {};
MED.outlets = [

  { name: 'GadgetGrid', focus: 'value', color: '#3ddc84' }, { name: 'PixelPeep', focus: 'camera', color: '#ffb648' },
  { name: 'FrameRate Lab', focus: 'gaming', color: '#ff4d6a' }, { name: 'Juice Lab', focus: 'battery', color: '#9be15d' },
  { name: 'MobileInsider', focus: 'build', color: '#ff7ad9' }, { name: 'Silicon Weekly', focus: 'chip', color: '#7aa2ff' },
];
MED.channels = [
  { name: 'TechWithTara', subs: 4.2e6, style: 'review' }, { name: 'UnboxPrime', subs: 9.1e6, style: 'unbox' }, { name: 'Dave Teardown', subs: 2.7e6, style: 'teardown' },
  { name: 'FPS Junkies', subs: 3.3e6, style: 'gaming' }, { name: 'Lens & Light', subs: 1.4e6, style: 'camera' }, { name: 'Budget Byte', subs: 2.1e6, style: 'value' },
  { name: 'SpeedTest Bros', subs: 5.5e6, style: 'versus' }, { name: 'Battery Bench', subs: 0.9e6, style: 'battery' },
];
MED.PRO = { perf: 'Blazing-fast performance', camera: 'Excellent cameras', display: 'Gorgeous display', battery: 'Outstanding battery life', build: 'Premium, beautiful design', software: 'Clean, smooth software', features: 'Packed with features', connect: 'Cutting-edge connectivity' };
MED.CON = { perf: 'Sluggish performance', camera: 'Mediocre cameras', display: 'Disappointing screen', battery: 'Weak battery life', build: 'Cheap-feeling build', software: 'Buggy, dated software', features: 'Missing key features', connect: 'Behind on network tech' };
MED.user = () => U.pick(['pixel', 'tech', 'droid', 'byte', 'neo', 'retro', 'mobile', 'gadget', 'turbo', 'silicon', 'captain', 'lazy', 'night', 'flash', 'quantum']) + U.pick(['_fan', 'guy', 'Queen', 'Lord', 'Nerd', 'Wizard', 'Cat', 'Fox', 'Panda', 'Owl', '_x', 'Bot']) + U.ri(1, 999);
MED.scoreColor = (v) => (v >= 8.5 ? '#3ddc84' : v >= 7 ? '#3ee6ff' : v >= 5 ? '#ffb648' : '#ff4d6a');

// core verdict model shared by all outlets
MED.verdict = (p, st, ev) => {
  const q = st.qual, fair = S.fairPrice(q.q), value = fair / p.price;
  const refs = S.segRefs(); const tier = S.tierOfPrice(p.price);
  const exp = refs[tier + 'Q'];
  let base = 5.4 + (q.q - exp) / 7 + U.log2(value) * 2.4;
  const flags = [];
  if (st.sustained < 0.6) { base -= 0.5; flags.push('hot'); }
  if (p.design.cam.extras.includes('macro')) flags.push('macro');
  if (st.weight > 225) flags.push('heavy');
  if (p.design.benchBoost && S.has('benchboost') && U.chance(0.6)) { base -= 1.8; flags.push('cheat'); }
  if (p.claims && p.claims.battery && st.sot < p.claims.battery) { base -= 0.8; flags.push('overclaim'); }
  if (p.claims && p.claims.hypeTalk && q.q < exp + 5) { base -= 0.4; flags.push('overhyped'); }
  if (ev && ev.failures.length) flags.push('eventfail');
  return { base, value, fair, flags, tier, exp };
};
MED.generateReviews = (p, ev) => {
  const st = S.stats(p), V = MED.verdict(p, st, ev);
  const q = st.qual.s;
  const n = ev ? U.clamp(2 + Math.round((ev.plan.press || 0) / 25), 3, 8) : U.clamp(2 + Math.round(G.rep / 20), 2, 6);
  const outlets = U.shuffle(MED.outlets.slice()).slice(0, n);
  const reviews = outlets.map((o) => {
    let sc = V.base;
    if (o.focus === 'value') sc += U.log2(V.value) * 1.2;
    else if (o.focus === 'gaming') sc += (q.perf - 0.9) * 3 + (st.sustained - 0.8) * 2 + (p.design.disp.hz >= 120 ? 0.4 : 0);
    else if (o.focus === 'chip') sc += (q.perf - 0.9) * 3 + (p.chipSource === 'own' ? 0.5 : 0);
    else if (o.focus && q[o.focus] != null) sc += (q[o.focus] - 0.9) * 3.5;
    sc = U.clamp(sc + U.gauss() * 0.35, 1, 10);
    sc = Math.round(sc * 10) / 10;
    const keys = Object.keys(q).sort((a, b) => q[b] - q[a]);
    const pros = keys.filter((k) => q[k] >= 0.98).slice(0, 2).map((k) => MED.PRO[k]);
    const cons = keys.slice().reverse().filter((k) => q[k] < 0.75).slice(0, 2).map((k) => MED.CON[k]);
    if (V.value > 1.3) pros.push('Incredible value for ' + U.money(p.price));
    if (V.value < 0.75) cons.push('Overpriced at ' + U.money(p.price));
    if (V.flags.includes('hot')) cons.push('Throttles and runs hot under load');
    if (V.flags.includes('macro')) cons.push('Pointless 2MP macro camera');
    if (V.flags.includes('heavy')) cons.push('Heavy (' + st.weight.toFixed(0) + ' g)');
    if (V.flags.includes('cheat')) cons.push('Caught boosting benchmark scores');
    if (V.flags.includes('overclaim')) cons.push('Battery life falls short of the keynote claims');
    if (p.design.body.jack && S.fy() > 2018) pros.push('Keeps the headphone jack');
    if (!pros.length) pros.push('Does the basics');
    if (!cons.length) cons.push('Nothing major');
    return { outlet: o.name, color: o.color, score: sc, headline: MED.headline(p, sc, V), pros: pros.slice(0, 3), cons: cons.slice(0, 3), verdict: MED.verdictLine(p, sc, V) };
  });
  p.reviews = reviews;
  p.reviewAvg = U.avg(reviews, (r) => r.score);
  p.media = MED.package(p, st, V, ev);
  if (V.flags.includes('cheat')) { G.rep = Math.max(0, G.rep - 4); S.news('🕵️ Reviewers catch ' + U.esc(p.name) + ' boosting benchmark scores. #BenchGate', 'bad'); }
  return reviews;
};
MED.headline = (p, sc, V) => {
  const N = p.name.toUpperCase(), n = p.name, P = U.money(p.price), T = { budget: 'budget phone', mid: 'mid-ranger', premium: 'premium phone', flagship: 'flagship' }[V.tier];
  if (sc >= 9.2) return U.pick([N + ' DESTROYS THE COMPETITION!', n + ' review: the new king of ' + T + 's', 'This is the best phone of ' + S.year() + '. Period.']);
  if (V.value > 1.4 && sc >= 7.5) return U.pick([n + ': how is this only ' + P + '?!', n + ' review: absurd value', 'The ' + n + ' makes ' + T + 's twice its price look silly']);
  if (sc >= 8.2) return U.pick([n + ' review: a near-perfect ' + T, G.co.name + ' has arrived', n + ' review: believe the hype']);
  if (sc >= 6.6) return U.pick([n + ' review: solid, but not spectacular', n + ' review: a safe bet', n + ' review: good, with a few compromises']);
  if (sc >= 5) return U.pick([n + ' review: hard to recommend at ' + P, n + ' review: so close, yet so far', n + ' review: the competition is better']);
  return p.price > 600 ? P + ' FOR THIS? THE WORST ' + T.toUpperCase() + ' OF THE YEAR!' : U.pick([n + ' review: skip it', n + ' review: a disappointing mess', 'Don\'t buy the ' + n]);
};
MED.verdictLine = (p, sc, V) => sc >= 8.5 ? 'An easy recommendation — ' + G.co.name + ' nailed it.' : sc >= 7 ? 'A strong ' + V.tier + ' option if you can live with the trade-offs.' : sc >= 5 ? 'There are better phones for ' + U.money(p.price) + '.' : 'Avoid. Spend your money elsewhere.';
MED.package = (p, st, V, ev) => {
  const rivalsAll = G.rivals.filter((r) => r.alive).flatMap((r) => r.phones);
  const near = rivalsAll.slice().sort((a, b) => Math.abs(Math.log(a.price / p.price)) - Math.abs(Math.log(b.price / p.price)));
  const rival = near[0];
  const avg = p.reviewAvg;
  const hype = p.hype;
  const reach = (G.regions[G.co.market].aware + 0.05) * (1 + hype / 40);
  const games = D.games.filter((g) => g.year <= S.year()).slice(-3);
  const gameTests = games.map((g) => { const r = M.gameSession(st, g, D.gfxPresets[2], { has: S.has, hz: p.design.disp.hz, ramGB: p.design.ram.gb, minutes: 15 }); return { game: g.name, avg: Math.round(r.avg), low: Math.round(r.low), maxT: +r.maxT.toFixed(1), over: r.overheated }; });
  const videos = U.shuffle(MED.channels.slice()).slice(0, 5).map((c) => {
    let title;
    if (c.style === 'unbox') title = p.name + ' Unboxing — First Impressions!';
    else if (c.style === 'versus') title = p.name + ' vs ' + (rival ? rival.name : 'the competition') + ' — SPEED TEST';
    else if (c.style === 'gaming') title = p.name + ' Gaming Test — ' + gameTests[gameTests.length - 1].game + ' at ' + gameTests[gameTests.length - 1].avg + ' FPS' + (gameTests[gameTests.length - 1].over ? ' (IT OVERHEATED 🔥)' : '');
    else if (c.style === 'camera') title = p.name + ' Camera Test vs ' + (rival ? rival.name : 'Flagships');
    else if (c.style === 'battery') title = p.name + ' Battery Drain Test: ' + st.sot.toFixed(1) + ' hours!';
    else if (c.style === 'teardown') title = 'What\'s inside the ' + p.name + '? Teardown';
    else if (c.style === 'value') title = avg >= 7.5 && V.value > 1.1 ? 'The ' + p.name + ' is the BEST VALUE phone right now' : 'Is the ' + p.name + ' worth ' + U.money(p.price) + '?';
    else title = avg >= 8 ? p.name + ' Review: I\'m Impressed.' : avg >= 6 ? p.name + ' Review: Watch Before You Buy!' : 'Don\'t buy the ' + p.name + '...';
    const views = Math.round(c.subs * U.rf(0.04, 0.12) * reach * (avg >= 8 || avg < 4.5 ? 1.8 : 1));
    return { channel: c.name, title, views, likes: Math.round(views * U.rf(0.02, 0.05) * (avg / 7)), mins: U.ri(8, 22) + ':' + String(U.ri(0, 59)).padStart(2, '0') };
  });
  const sentiment = U.clamp(0.5 + (avg - 6.5) / 6 + (V.value - 1) * 0.25 - (ev && ev.failures.length ? 0.12 : 0), 0.05, 0.97);
  const comments = [];
  for (let i = 0; i < 9; i++) {
    const r = Math.random();
    const P = U.money(p.price), RV = rival ? rival.name : 'my old phone';
    let t;
    if (r < sentiment * 0.85) t = U.pick(['Take my money! 💸', 'Finally a phone that gets it right.', P + ' is a steal for these specs.', 'Battery life looks insane.', 'This camera though 🔥', 'Switching from ' + RV + ' as soon as it\'s out.', 'Underdog brand cooking 🔥', 'The design is so clean.', 'Preordered. No regrets.']);
    else if (r < sentiment * 0.85 + 0.18) t = U.pick(['Wait for the reviews.', 'Looks nice, but who even are ' + G.co.name + '?', 'Decent specs. Price is ok I guess.', 'Will it get updates though?', 'Hmm, not bad.']);
    else t = U.pick([P + '?? lol no.', 'Another boring phone.', 'Throttles like crazy, pass.', 'My ' + RV + ' is still better.', 'That battery is tiny.', 'Benchmarks are fake, wake up.', 'Remember when phones were cheap?', 'The keynote was so cringe 😬']);
    comments.push({ user: MED.user(), text: t, likes: U.ri(0, 4000) });
  }
  if (ev && ev.failures.length) ev.failures.forEach((f) => comments.unshift({ user: MED.user(), text: { overheat: 'The phone literally overheated ON STAGE 💀', lowfps: 'that ' + (ev.fps || 18) + ' FPS demo lmao', crash: 'camera app crashed live 😂😂', cheat: 'caught cheating benchmarks live on stream, iconic', awkward: 'the guest segment was SO awkward' }[f] || 'that keynote fail tho', likes: U.ri(3000, 40000) }));
  const tag = '#' + p.name.replace(/[^A-Za-z0-9]/g, '');
  const memes = ev ? ev.failures.map((f) => ({ overheat: '#HotPhoneSummer', lowfps: '#' + (ev.fps || 18) + 'FPS', crash: '#CameraCrash', cheat: '#BenchGate', awkward: '#AwkwardKeynote' }[f])) : [];
  const ranks = rivalsAll.map((ph) => ({ name: ph.name, total: ph.st.bench.total, sot: ph.st.sot, cam: ph.st.cam.score, price: ph.price })).concat([{ name: p.name, total: st.bench.total, sot: st.sot, cam: st.cam.score, price: p.price, me: true }]);
  return {
    t: G.t, videos, comments: comments.slice(0, 10), gameTests,
    camera: { day: Math.round(st.cam.day), night: Math.round(st.cam.night), video: Math.round(st.cam.video), zoom: Math.round(st.cam.zoom), selfie: Math.round(st.cam.selfie), score: Math.round(st.cam.score) },
    battery: { sot: +st.sot.toFixed(1), rank: ranks.slice().sort((a, b) => b.sot - a.sot).findIndex((x) => x.me) + 1, n: ranks.length, charge: Math.round(st.chargeMin) },
    bench: ranks.sort((a, b) => b.total - a.total).slice(0, 10).concat(ranks.find((x) => x.me && ranks.indexOf(x) >= 10) ? [ranks.find((x) => x.me)] : []).map((x) => ({ name: x.name, total: x.total, me: !!x.me, price: x.price })),
    social: { tag, mentions: Math.round(2000 * reach * (1 + hype / 20) * U.rf(0.8, 1.3) * Math.pow(1.25, S.fy() - 2010)), sentiment, memes: memes.filter(Boolean), trending: hype > 45 || (ev && ev.score > 75) || memes.length > 0 },
    rival: rival ? rival.name : null,
  };
};

  } else if (tab === 'video') {

    s += '<div class="card flat"><h3>🔋 Battery</h3>' + H.stat('Screen-on time', m.battery.sot + ' h') + H.stat('Rank', '#' + m.battery.rank + ' of ' + m.battery.n) + H.stat('Full charge', m.battery.charge + ' min') + '</div>';
  } else if (tab === 'bench') {

  } else {
    s += '<div class="kpis">' + H.kpi('Mentions', U.num(m.social.mentions), m.social.tag) + H.kpi('Sentiment', U.pct(m.social.sentiment, 0), m.social.sentiment > 0.6 ? 'positive' : m.social.sentiment > 0.4 ? 'mixed' : 'negative', m.social.sentiment > 0.6 ? 'good' : m.social.sentiment < 0.4 ? 'bad' : '') + '</div>';

    s += '<div class="mt12">' + m.comments.map((c) => '<div class="comment"><div class="u">@' + c.user + '</div>' + U.esc(c.text) + ' <span class="tiny dim">👍 ' + U.num(c.likes) + '</span></div>').join('') + '</div>';
  }

/* ---------------- Outcome ---------------- */
EV.apply = (res) => {
  const pl = res.plan, p = S.phoneById(pl.phoneId);
  const city = EV.find(EV.cities, pl.city), v = EV.find(EV.venues, pl.venue);
  const attendees = Math.round(pl.cap * U.clamp(0.4 + G.rep / 120 + p.hype / 200 + (pl.ads > 0 ? 0.15 : 0), 0.3, 1));
  const viewers = Math.round(EV.viewers(pl) * (0.7 + res.score / 160));
  const reach = attendees * 3 + viewers + pl.press * 25000 * (0.4 + G.rep / 100);
  const reachF = Math.log10(1 + reach / 1000) / 3; // ~0..1.5
  const sc = res.score;
  // hype & awareness
  p.hype = U.clamp(p.hype + (sc - 35) * 0.9 * (0.5 + reachF), 0, 100);
  const globalBoost = reachF * Math.max(0, sc - 30) / 100 * 0.06;
  D.regionIds.forEach((r) => { const R = G.regions[r]; if (R.entered || R.entering) R.aware = U.clamp(R.aware + globalBoost * (1 - R.aware) + (r === city.r ? 0.04 * reachF * sc / 100 : 0) + pl.retail * 0.00008, 0, 0.98); });
  // reputation & investors
  const repD = (sc - 55) / 11 - res.failures.length * 1.2;
  G.rep = U.clamp(G.rep + repD, 0, 100);

/* ---------------- end of event ---------------- */
UI.A.kEnd = () => {
  const s = KN.s; if (!s) return;
  if (s.mode === 'replay') { KN.teardown(); UI.render(); return; }
  if (s.ended || s.busy || s.choice) return;
  KN.ask('End the event now?', [{ text: '⏹ Yes, wrap it up', v: 1 }, { text: '↩️ No, keep presenting', v: 0 }], (o) => { if (o.v) KN.end(); });
};
KN.end = () => {
  const s = KN.s; if (s.ended) return;
  s.ended = true; s.busy = true; KN.updateActions();
  if (!s.done.reveal) { s.mood -= 12; s.failures.push('noreveal'); }
  const avgImp = U.avg(s.impacts, (x) => x.r);
  const segs = Object.keys(s.done).length;
  const over = Math.max(0, s.clock - s.plan.duration);
  const score = U.clamp(0.58 * s.mood + 0.22 * s.peak + 18 * avgImp + 2 * Math.min(6, segs) - 5 * s.failures.filter((f) => f !== 'noreveal').length - over * 0.3 - (s.failures.includes('noreveal') ? 15 : 0), 0, 100);
  s.rec.frames.push(KN.frame());
  const res = { id: s.id, plan: s.plan, score, failures: s.failures.filter((f) => f !== 'noreveal'), claims: s.claims, priceFinal: s.priceFinal, avail: s.avail, priceReaction: s.priceReaction, fps: s.fps, extra: s.extra && s.done.onemore ? s.extra : null,
    replay: { plan: s.plan, look: s.look, frames: s.rec.frames, events: s.rec.events, dur: Math.round(s.real), coName: G.co.name, logo: G.co.logo } };
  const ev = EV.apply(res);
  const box = $('#kChoice'); s.choice = true;
  box.innerHTML = '<div class="box"><div class="kPanel"><div style="text-align:center"><div class="tiny" style="letter-spacing:2px;opacity:.6">EVENT OVER</div><div style="font-size:44px;font-weight:900;color:' + MED.scoreColor(score / 10) + '">' + score.toFixed(0) + '<span style="font-size:18px;opacity:.6">/100</span></div><div>' + U.esc(ev.summary) + '</div></div>' +
    '<div class="grid2 mt12"><div class="kpi"><div class="l">Crowd mood</div><div class="v">' + s.mood.toFixed(0) + '</div></div><div class="kpi"><div class="l">Peak</div><div class="v">' + s.peak.toFixed(0) + '</div></div><div class="kpi"><div class="l">Watched live</div><div class="v">' + U.num(ev.viewers) + '</div></div><div class="kpi"><div class="l">Preorders</div><div class="v">' + U.num(ev.preorders) + '</div></div></div>' +
    (ev.headlines || []).map((h) => '<div class="headline mt12" style="font-size:15px">' + U.esc(h.text) + ' <span class="tiny mute">— ' + h.outlet + '</span></div>').join('') + '</div>' +
    '<button class="opt" id="kGoMedia">📰 See the reviews & reactions</button><button class="opt" id="kGoReplay">▶ Watch the replay</button><button class="opt" id="kGoExit">🏢 Back to HQ</button></div>';
  box.classList.add('on');
  $('#kGoMedia').onclick = () => { KN.teardown(); UI.tab = 'launch'; UI.render(); MED.tab = 'news'; MED.show(S.phoneById(ev.phoneId), ev.id); };
  $('#kGoReplay').onclick = () => { KN.teardown(); KN.replay(ev); };
  $('#kGoExit').onclick = () => { KN.teardown(); UI.tab = 'hq'; UI.render(true); };
};

/* ---------------- replay ---------------- */
KN.replay = (ev) => {
  const rp = ev.replay;
  const c = KN.common(rp.plan, rp.look);
  c.logo = rp.logo || G.co.logo; c.coName = rp.coName || G.co.name;
  KN.s = Object.assign(c, { mode: 'replay', rec: { frames: rp.frames, events: rp.events }, real: 0, dur: rp.dur, playing: true, speed: 1, camX: 0, q: [], evName: ev.name });
  KN.active = true;
  KN.buildDOM();
  $('#kJoy').classList.add('hidden'); $('#kActions').innerHTML = '';
  $('#kEnd').textContent = '✕ Close';
  const bar = $('#kReplayBar'); bar.classList.remove('hidden');
  bar.innerHTML = '<button class="btn sm" data-a="kPlay" id="kPlayB">⏸</button><input type="range" id="kScrub" min="0" max="' + rp.dur + '" value="0" step="100"><button class="btn sm" data-a="kSpeed" id="kSpd">1×</button>';
  $('#kScrub').oninput = (e) => { KN.s.real = +e.target.value; KN.renderFeed(); };
  KN.last = performance.now(); KN.loop();
};
UI.A.kPlay = () => { const s = KN.s; if (!s) return; if (s.real >= s.dur) s.real = 0; s.playing = !s.playing; $('#kPlayB').textContent = s.playing ? '⏸' : '▶'; };
UI.A.kSpeed = () => { const s = KN.s; s.speed = s.speed === 1 ? 2 : s.speed === 2 ? 4 : 1; $('#kSpd').textContent = s.speed + '×'; };

/* ---------------- main loop ---------------- */

/* ---------------- view state (shared by live & replay) ---------------- */
KN.view = () => {
  const s = KN.s, t = s.real, evs = s.rec.events;
  let pres;

    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (fr[mid][0] <= t) lo = mid; else hi = mid - 1; }
    const a = fr[lo] || [0, 0, s.Dd / 2, 1, 0, 0, 50], b = fr[Math.min(fr.length - 1, lo + 1)] || a;
    const k = b[0] > a[0] ? U.clamp((t - a[0]) / (b[0] - a[0]), 0, 1) : 0;
    pres = { x: U.lerp(a[1], b[1], k), z: U.lerp(a[2], b[2], k), dir: a[3], walk: a[4], talk: a[5], phase: t / 1000 * 9 };

    else if (e.e === 'react') react = e;
    else if (e.e === 'cap') cap = e;

      x.font = '700 ' + fs * 0.4 + 'px monospace'; x.fillStyle = temp > 45 ? '#ff4d6a' : '#ddd'; x.fillText(temp.toFixed(1) + '°C · ' + d.preset, X + 10, Y + fs * 1.6);
      x.fillStyle = '#fff'; x.textAlign = 'right'; x.font = '800 ' + fs * 0.42 + 'px sans-serif'; x.fillText(d.g, X + W - 8, Y + fs * 0.6);
      if (over) { x.fillStyle = 'rgba(160,0,20,0.75)'; x.fillRect(X, Y, W, Hh); txt('⚠ Device temperature too high', cy, fs * 0.75, '#fff', 900); txt('App closed to cool down', cy + fs, fs * 0.45, '#fff', 500); }
      break;
    }
    case 'camera': {
      if (d.crashed) { x.fillStyle = '#111'; x.fillRect(X, Y, W, Hh); x.fillStyle = '#2a2f3a'; R.rr(x, cx - W * 0.3, cy - Hh * 0.22, W * 0.6, Hh * 0.44, 12); x.fill(); txt('Camera has stopped', cy - fs * 0.3, fs * 0.6, '#fff', 800); txt('Close app', cy + fs * 0.8, fs * 0.45, '#3ee6ff', 700); break; }
      const q = U.clamp(d.score / 120, 0.05, 1.2), rng = U.srng(77);
      const night = d.mode === 'night';
      x.fillStyle = night ? '#0a0812' : '#87b6e8'; x.fillRect(X, Y, W, Hh);
      const rows = d.mode === 'zoom' ? 2 : 4;
      for (let r = 0; r < rows; r++) for (let i = 0; i < 14; i++) { const hx = X + (i + 0.5) * W / 14 + (rng() - 0.5) * 6, hy2 = Y + Hh * (0.35 + r * 0.17), rr = (Hh * 0.06) * (1 + r * 0.25) * (d.mode === 'zoom' ? 2.2 : 1); x.fillStyle = night ? '#2a2030' : '#3a3040'; x.beginPath(); x.arc(hx, hy2, rr, 0, 7); x.fill(); x.fillStyle = night ? '#1c1828' : '#283048'; x.fillRect(hx - rr * 1.3, hy2 + rr * 0.8, rr * 2.6, rr * 2); }
      if (night) { x.save(); x.globalCompositeOperation = 'lighter'; for (let i = 0; i < 5; i++) { const g2 = x.createRadialGradient(X + W * (0.1 + i * 0.2), Y, 2, X + W * (0.1 + i * 0.2), Y, Hh * 0.6); g2.addColorStop(0, 'rgba(255,200,120,0.4)'); g2.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g2; x.fillRect(X, Y, W, Hh); } x.restore(); }
      const noise = U.clamp((1 - q) * (night ? 0.9 : 0.4), 0, 0.9);
      const nr = U.srng(91); for (let i = 0; i < 1400 * noise; i++) { x.fillStyle = 'rgba(' + (nr() < 0.5 ? '255,255,255' : '0,0,0') + ',' + noise * 0.5 + ')'; x.fillRect(X + nr() * W, Y + nr() * Hh, 2, 2); }
      if (night && q < 0.6) { x.fillStyle = 'rgba(0,0,0,' + (0.6 - q) * 0.8 + ')'; x.fillRect(X, Y, W, Hh); }
      x.fillStyle = 'rgba(0,0,0,0.55)'; x.fillRect(X, Y + Hh - fs * 0.9, W, fs * 0.9); x.fillStyle = '#fff'; x.font = '700 ' + fs * 0.4 + 'px sans-serif'; x.textAlign = 'left'; x.fillText('📷 Shot live on ' + s.look.name + ' · ' + d.mode + ' · score ' + d.score, X + 8, Y + Hh - fs * 0.3);
      break;
    }
    case 'battery': {
      txt('🔋 Screen-on battery life', Y + Hh * 0.13, fs * 0.6, ink, 800);
      const mx = Math.max(...d.rows.map((r) => r[1])), pr = U.clamp(t / 2, 0, 1);
      d.rows.forEach(([n, h, me], i) => { const y = Y + Hh * 0.22 + i * Hh * 0.16; x.fillStyle = me ? '#3ddc84' : 'rgba(255,255,255,0.25)'; x.fillRect(X + W * 0.34, y, W * 0.52 * h / mx * pr, Hh * 0.1); x.fillStyle = ink; x.font = (me ? '800 ' : '500 ') + fs * 0.36 + 'px sans-serif'; x.textAlign = 'right'; x.fillText(n.length > 18 ? n.slice(0, 17) + '…' : n, X + W * 0.32, y + Hh * 0.075); x.textAlign = 'left'; x.fillText((h * pr).toFixed(1) + ' h', X + W * 0.35 + W * 0.52 * h / mx * pr + 4, y + Hh * 0.075); });
      break;
    }
    case 'price': { txt(s.look.name, Y + Hh * 0.28, fs * 0.7, ink, 700, fadeIn); const sc2 = 0.6 + 0.4 * U.clamp((t - 0.6) / 0.5, 0, 1); txt(U.money(d.price), Y + Hh * 0.6, fs * 2.2 * sc2, ink, 900, U.clamp((t - 0.6) / 0.4, 0, 1)); txt(d.avail, Y + Hh * 0.82, fs * 0.5, ink, 600, U.clamp((t - 1.2) / 0.5, 0, 1)); break; }
    case 'trailer': {
      const q = d.q, lk = s.look, scale = Hh * (0.6 + q * 0.4) / lk.st.bodyH;
      const shot = Math.floor(t / 1.6) % 4;
      x.save(); x.translate(cx + Math.sin(t * 0.6) * W * 0.1, cy); x.rotate(Math.sin(t * 0.4) * 0.25 * q); x.scale(1 + t * 0.03, 1 + t * 0.03);
      R.drawPhone(x, 0, 0, scale, lk.d, lk.st, shot % 2 ? 'front' : 'back', { color: lk.color, glow: 'rgba(255,255,255,0.4)' });
      x.restore();
      const sweep = (t * 0.7) % 1; const sg = x.createLinearGradient(X + W * sweep - 60, 0, X + W * sweep + 60, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,' + 0.25 * q + ')'); sg.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = sg; x.fillRect(X, Y, W, Hh);
      if (q > 0.5) { const rng = U.srng(5); x.save(); x.globalCompositeOperation = 'lighter'; for (let i = 0; i < 60 * q; i++) { x.fillStyle = 'rgba(160,200,255,' + 0.5 * rng() + ')'; x.fillRect(X + ((rng() * W + t * 40 * (1 + rng())) % W), Y + rng() * Hh, 2, 2); } x.restore(); }
      x.fillStyle = 'rgba(0,0,0,1)'; x.fillRect(X, Y, W, Hh * 0.1); x.fillRect(X, Y + Hh * 0.9, W, Hh * 0.1);
      if (t > 4.2) txt(d.tag, Y + Hh * 0.82, fs * 0.8, '#fff', 900, U.clamp((t - 4.2) / 0.6, 0, 1));
      break;
    }
    case 'guest': txt('Please welcome', cy - fs * 0.6, fs * 0.55, ink, 500, fadeIn); txt(d.name, cy + fs * 0.6, fs * 1.0, ink, 900, U.clamp((t - 0.5) / 0.5, 0, 1)); break;
    case 'onemore': { txt('One more thing…', cy - (t > 2.5 ? fs * 0.8 : 0), fs * 0.9, '#fff', 300, fadeIn); if (t > 2.5) txt(d.label, cy + fs * 0.6, fs * 0.75, '#3ee6ff', 900, U.clamp((t - 2.5) / 0.6, 0, 1)); break; }
  }
};

UI.init();
</script>
